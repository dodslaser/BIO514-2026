    search: true
    left:
      - text: "Home"
        href: index.qmd
      - sidebar:cli
      - sidebar:vc
      - sidebar:phylo
      - sidebar:gwas

  sidebar:
    - id: cli
      title: "Command Line Programming"
      style: docked
      background: light
      contents:
      - section: "Command Line Programming Repetition"
