          text: "Repetition: CLI Repetition"

    - id: vc
      title: "Variant Calling"
      style: docked
      background: light
      contents:
      - section: "Variant Calling"
        contents:
        - href: "practicals/Practicals - Variant Calling/PRACTICAL_VARIANT_CALLING.qmd"
          text: "Practical 1: Variant Calling"
        - href: "practicals/Practicals - Variant Calling/PRACTICAL_PLINK_INTRO.qmd"
          text: "Practical 2: PLINK Introduction"

    - id: phylo
      title: "Phylogeny"
      style: docked
      background: light
      contents:
      - href: "practicals/Practicals - Phylogeny/PRACTICAL_PHYLOGENY.qmd"
        text: "Practical 3: Phylogeny"

    - id: gwas
      title: "GWAS"
      style: docked
      background: light
      contents:
